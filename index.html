<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NECRON // DYNASTIC COMMAND</title>
<style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#e7edf5;background:#10151d}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid #354152;background:#182230;flex-wrap:wrap}h1{font-size:19px;margin:0 24px 0 0}select,input,button{background:#202c3a;border:1px solid #435369;border-radius:5px;color:inherit;padding:9px}button{cursor:pointer}button:hover{background:#30435a}.accent{background:#37618c}main{display:grid;grid-template-columns:minmax(210px,25%) minmax(350px,1fr) minmax(250px,28%);height:calc(100vh - 77px)}section{padding:18px;overflow:auto;border-right:1px solid #344255}h2{font-size:14px;text-transform:uppercase;letter-spacing:.09em;color:#b5c9e0}#search{width:100%;margin-bottom:12px}.unit,.roster-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #2f3b4a;padding:11px 4px}.unit button,.roster-row button{padding:5px 9px}.muted{color:#98a9bd;font-size:13px}.points{margin-left:auto;font-variant-numeric:tabular-nums}#roster{margin-top:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}#details{white-space:pre-wrap;line-height:1.6}.pill{background:#253d55;border-radius:30px;padding:4px 10px;font-size:12px}footer{font-size:12px;color:#a6b5c7;margin-top:22px}@media(max-width:850px){main{display:block;height:auto}section{min-height:250px;border-bottom:1px solid #344255}}

/* Dynastic command interface */
:root{font-family:Consolas,'Segoe UI',monospace;color:#c5e5d0;background:#050b09;--glow:#57ff9b;--line:#24563c;--panel:#091510}
body{background:radial-gradient(ellipse at 50% -20%,#123d2c 0%,#06110c 44%,#030706 100%);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,#143526 4px);z-index:4}
header{background:linear-gradient(115deg,#0c2118,#06120e);border-bottom:1px solid #46a56d;box-shadow:0 1px 22px #1eec7640;min-height:80px}
h1{font-family:Georgia,serif;letter-spacing:.17em;font-size:21px;color:#8cffb2;text-shadow:0 0 14px #27e36b88}
h1:before{content:"◇";font-family:serif;margin-right:12px;color:#6bff99}
h2{font-family:Georgia,serif;color:#69eb99;letter-spacing:.18em;border-bottom:1px solid #225338;padding-bottom:12px}
section{background:linear-gradient(160deg,#0a1912eb,#07100deb);border-right:1px solid #27593c}
section:nth-child(2){background:linear-gradient(160deg,#0b1d15,#07130e)}
select,input,button{background:#071c12;border:1px solid #2b754b;border-radius:0;color:#b7f9c8;font-family:inherit}
button{transition:background .15s,box-shadow .15s}button:hover{background:#174b2e;box-shadow:0 0 12px #4eff7a44}
button:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid #7fffab}
.accent{background:#164b2e;border-color:#60d88b;color:#d9ffe4}
.unit,.roster-row{border-bottom:1px solid #1c3a2a}
.unit:hover,.roster-row:hover{background:#10291b}
.muted,footer{color:#8ba99a}
.pill{background:#103d25;color:#9effbd;border:1px solid #2d8c53;border-radius:0}
.points,#total{color:#86ffaf;font-family:Consolas,monospace}
#details{white-space:normal;line-height:1.55}
.data-block{border:1px solid #214b33;background:#07150e;margin:12px 0;padding:12px}
.data-label{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#67b786}
.data-value{margin-top:4px;font-size:15px;color:#d0f9db;overflow-wrap:anywhere}
#details h3{color:#a2ffc0;font-family:Georgia,serif;letter-spacing:.09em}
#details ul{padding-left:18px}
#details li{margin:6px 0}
@media(max-width:850px){header{gap:10px}h1{font-size:17px}}
</style></head><body>
<header><h1>DYNASTIC COMMAND <span class="pill">AWAKENING // PROTOTYPE</span></h1><label>Faction <select id="faction"><option>Necrons</option></select></label><label>Limit <input id="limit" type="number" min="0" value="2000" style="width:90px"></label><strong id="total">0 / 2000 pts</strong></header>
<main><section><h2>Dynastic archives</h2><input id="search" placeholder="Search units..."><div id="catalog" class="muted">Loading BSData...</div></section>
<section><h2>Legion manifest</h2><div class="toolbar"><button id="save" class="accent">Save locally</button><button id="export">Export JSON</button><button id="import">Import JSON</button><input id="file" type="file" accept=".json" hidden></div><div id="roster"></div><footer>Points and validation are provisional. This prototype does not yet interpret BSData's full constraint system.</footer></section>
<section><h2>Canoptek analysis</h2><div id="details" class="muted">Select a unit to inspect its available records.</div></section></main>
<script>
const base='https://raw.githubusercontent.com/BSData/wh40k-11e/main/';
const $=id=>document.getElementById(id);
let units=[],roster=JSON.parse(localStorage.getItem('wh40k-prototype-roster')||'[]'),selected=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function walk(node,out,depth=0){if(!node||typeof node!=='object'||depth>30)return;if(Array.isArray(node)){node.forEach(n=>walk(n,out,depth+1));return}if(node.name&&(/selectionentry/i.test(node.type||'')||node.selectionEntryGroups||node.selectionEntries)&&!node.catalogue){out.push(node)}for(const [k,v] of Object.entries(node))if(typeof v==='object')walk(v,out,depth+1)}
function point(n){const p=n.costs||n.cost||[];const a=Array.isArray(p)?p:[p];const x=a.find(x=>/pt|point/i.test(x.name||x.type||''))||a[0];return Number(x?.value)||0}
function render(){const q=$('search').value.toLowerCase();$('catalog').innerHTML=units.filter(u=>u.name.toLowerCase().includes(q)).slice(0,300).map(u=>'<div class="unit"><span>'+esc(u.name)+'</span><span class="points muted">'+(point(u)||'?')+' pts</span><button data-add="'+esc(u.id)+'">+</button></div>').join('')||'<p class="muted">No matching units.</p>';$('roster').innerHTML=roster.map((r,i)=>'<div class="roster-row"><button data-view="'+i+'">'+esc(r.name)+'</button><span class="points">'+r.points+' pts</span><button data-copy="'+i+'">Copy</button><button data-remove="'+i+'">×</button></div>').join('')||'<p class="muted">No units added.</p>';const total=roster.reduce((s,r)=>s+r.points,0),limit=Number($('limit').value);$('total').textContent=total+' / '+limit+' pts';$('total').style.color=total>limit?'#ff8c86':'#e7edf5';if(selected){const u=selected;const blocks=[['Designation',u.name],['Unit identifier',u.id],['Entry classification',u.type||'Unspecified'],['Recorded points',point(u)||'Unresolved'],['Profiles',Array.isArray(u.profiles)?u.profiles.map(p=>p.name||'Profile').join(', '):'Not available in this entry'],['Options',Array.isArray(u.selectionEntries)?u.selectionEntries.map(x=>x.name).join(', '):'Not resolved']];$('details').innerHTML='<h3>'+esc(u.name||'Unknown entity')+'</h3>'+blocks.map(([label,value])=>'<div class="data-block"><div class="data-label">'+esc(label)+'</div><div class="data-value">'+esc(value)+'</div></div>').join('')+'<p class="muted">Source fields shown here are preliminary. Full equipment and datasheet interpretation will follow.</p>'}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.add){const u=units.find(x=>String(x.id)===d.add);if(u){roster.push({id:u.id,name:u.name,points:point(u)});selected=u}}if(d.remove!==undefined)roster.splice(+d.remove,1);if(d.copy!==undefined)roster.splice(+d.copy+1,0,{...roster[+d.copy]});if(d.view!==undefined)selected=units.find(x=>x.id===roster[+d.view].id)||roster[+d.view];render()});
$('search').oninput=render;$('limit').oninput=render;$('save').onclick=()=>{localStorage.setItem('wh40k-prototype-roster',JSON.stringify(roster));alert('Saved in this browser')};$('export').onclick=()=>{const a=document.createElement('a'),blob=new Blob([JSON.stringify(roster,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='army.json';a.click();URL.revokeObjectURL(a.href)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw Error('Expected a list');roster=data.filter(x=>typeof x.name==='string'&&Number.isFinite(x.points));render()}catch(err){alert('Invalid army file: '+err.message)}};
async function load(){try{const response=await fetch(base+'Necrons.json');if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json(),found=[];walk(data,found);units=[...new Map(found.filter(x=>x.id&&x.name).map(x=>[x.id,x])).values()].sort((a,b)=>a.name.localeCompare(b.name));if(!units.length)throw Error('No selectable entries found');render()}catch(e){$('catalog').textContent='Could not load faction data: '+e.message}}
render();load();
</script></body></html>
